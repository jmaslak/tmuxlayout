name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The race detector is not available on every platform in CI.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Fuzz
        run: go test -fuzz FuzzRender -fuzztime 2m ./tmuxlayout
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-corpus
          path: tmuxlayout/testdata/fuzz/

  # The layout strings this produces are only right if tmux agrees, so check
  # them against a real tmux rather than only against recorded expectations.
  tmux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Test against a running tmux
        run: go test -tags tmux ./tmuxlayout

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
